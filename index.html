<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adsgram Earning Mini App — Telegram WebApp</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-hover: #1f242c;
      --border: #30363d;
      --accent: #2ea043;
      --accent-glow: rgba(46, 160, 67, 0.35);
      --telegram-blue: #2481cc;
      --telegram-hover: #1b66a4;
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.3);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --danger: #f85149;
      --success: #3fb950;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow-x: hidden;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #121822 0%, #0d1117 100%);
      position: relative;
      padding-bottom: 90px;
    }

    /* Top User Bar */
    .user-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2481cc, #1d9bf0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(36, 129, 204, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .user-meta h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-level {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-weight: 600;
    }

    .user-meta p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-tg-tag {
      background: rgba(36, 129, 204, 0.12);
      border: 1px solid rgba(36, 129, 204, 0.35);
      color: #58a6ff;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Main Balance Card */
    .balance-card {
      margin: 16px 20px;
      padding: 24px 20px;
      background: linear-gradient(135deg, #161b22 0%, #1f2733 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    .balance-card::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .balance-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .balance-coins-wrap {
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .coin-icon-big {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--gold-glow);
      font-size: 20px;
    }

    .balance-amount {
      font-size: 40px;
      font-weight: 800;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -1px;
    }

    .balance-fiat {
      font-size: 14px;
      color: #3fb950;
      font-weight: 700;
      background: rgba(63, 185, 80, 0.1);
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      border: 1px solid rgba(63, 185, 80, 0.25);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 20px 20px;
    }

    .action-btn-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .action-btn-card:active {
      transform: scale(0.97);
    }

    .action-btn-card .icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .action-btn-card h3 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .action-btn-card p {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Primary Watch Ad Button */
    .watch-ad-container {
      margin: 0 20px 24px;
    }

    .btn-watch-ad {
      width: 100%;
      background: linear-gradient(135deg, #2ea043 0%, #238636 100%);
      border: none;
      border-radius: 18px;
      padding: 18px;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(46, 160, 67, 0.4);
      transition: all 0.2s;
    }

    .btn-watch-ad:active {
      transform: scale(0.98);
    }

    .btn-watch-ad:disabled {
      background: #21262d;
      color: #8b949e;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Tasks list section */
    .section-title-wrap {
      padding: 0 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-heading {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .task-item {
      margin: 0 20px 10px;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .task-details h4 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .task-details p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-task {
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid var(--accent);
      color: #3fb950;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-task.claimed {
      background: #21262d;
      border-color: #30363d;
      color: #8b949e;
      cursor: default;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      height: 70px;
      background: rgba(18, 24, 34, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
    }

    .nav-item.active {
      color: #58a6ff;
    }

    /* Modals & Overlays */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 24px 20px 40px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }

    .btn-close-modal {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    /* Forms */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-input, .form-select {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-input:focus, .form-select:focus {
      border-color: #58a6ff;
    }

    .btn-submit {
      width: 100%;
      background: #2ea043;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Admin Sub Tabs */
    .admin-nav-tabs {
      display: flex;
      gap: 6px;
      background: #0d1117;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .admin-tab-btn {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .admin-tab-btn.active {
      background: #21262d;
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .admin-content-card {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .admin-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .admin-chip {
      background: #161b22;
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .admin-chip-del {
      cursor: pointer;
      color: #f85149;
      font-weight: bold;
    }

    .admin-cashout-item {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .btn-action-sm {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .btn-approve {
      background: #2ea043;
      color: white;
    }

    .btn-reject {
      background: #da3633;
      color: white;
    }

    /* Fallback Ad Player Modal */
    .ad-player-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 300;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .ad-player-modal.active {
      display: flex;
    }

    .ad-player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ad-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
    }

    .ad-brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #2481cc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
    }

    .ad-timer-badge {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .ad-video-mock {
      background: #111;
      border: 1px solid #222;
      border-radius: 20px;
      height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .ad-product-card {
      background: #1a1f29;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #30363d;
      max-width: 320px;
    }

    .ad-icon-big {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .ad-cta-btn {
      background: #2481cc;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .ad-footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-skip-ad {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-skip-ad:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Toast Notification */
    .toast-notice {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      z-index: 1000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 90%;
    }

    .toast-notice.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Daily check-in streak container */
    .streak-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin: 16px 0;
    }

    .day-box {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
    }

    .day-box.active {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
    }

    .day-box.claimed {
      background: rgba(46, 160, 67, 0.15);
      border-color: #2ea043;
    }

    .day-box .day-title {
      font-size: 10px;
      color: var(--text-muted);
    }

    .day-box .day-reward {
      font-size: 11px;
      font-weight: 700;
      color: #fbbf24;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Toast Notification element -->
  <div id="appToast" class="toast-notice"></div>

  <div class="app-container">
    <!-- Top User Bar -->
    <header class="user-header">
      <div class="user-info">
        <div class="user-avatar" id="userAvatarText">U</div>
        <div class="user-meta">
          <h2 id="userDisplayName">
            Loading... <span class="badge-level">Lvl 1</span>
          </h2>
          <p id="userTgHandle">@telegram_user</p>
        </div>
      </div>
      <div class="header-actions" style="display: flex; gap: 6px; align-items: center;">
        <div class="btn-tg-tag" id="adminBadgeBtn" style="display: none; background: rgba(245, 158, 11, 0.2); border: 1px solid #f59e0b; color: #fbbf24; cursor: pointer;" title="Open Admin Panel">
          <span>👑 Admin</span>
        </div>
        <div class="btn-tg-tag" id="btnSwitchId" title="Switch or View Real Telegram ID">
          <span>🆔 ID</span>
        </div>
      </div>
    </header>

    <!-- Main Balance Card -->
    <div class="balance-card">
      <div class="balance-label">
        <span>Total Earnings Balance</span>
      </div>
      <div class="balance-coins-wrap">
        <div class="coin-icon-big">🪙</div>
        <div class="balance-amount" id="balanceCoins">0</div>
      </div>
      <div class="balance-fiat" id="balanceFiat">≈ 0.00 BDT</div>
    </div>

    <!-- Quick Action Cards -->
    <div class="action-grid">
      <div class="action-btn-card" id="openDailyBtn">
        <div class="icon-box" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b;">📅</div>
        <h3>Daily Bonus</h3>
        <p id="dailyBadge">Check-in Claim</p>
      </div>

      <div class="action-btn-card" id="openWithdrawBtn">
        <div class="icon-box" style="background: rgba(46, 160, 67, 0.15); color: #3fb950;">💳</div>
        <h3>ক্যাশআউট</h3>
        <p>bKash, Nagad, Rocket</p>
      </div>

      <div class="action-btn-card" id="openInviteBtn">
        <div class="icon-box" style="background: rgba(36, 129, 204, 0.15); color: #58a6ff;">👥</div>
        <h3>Invite Friends</h3>
        <p>+200 Coins / Ref</p>
      </div>

      <div class="action-btn-card" id="openStatsCard">
        <div class="icon-box" style="background: rgba(168, 85, 247, 0.15); color: #a855f7;">📊</div>
        <h3>Today's Ads</h3>
        <p id="adsTodayVal">0 / 30</p>
      </div>
    </div>

    <!-- PRIMARY REWARDED AD BUTTON (Adsgram) -->
    <div class="watch-ad-container">
      <button id="btnWatchRewardedAd" class="btn-watch-ad">
        <span>🎬 Watch Video Ad & Earn</span>
        <span style="background: rgba(0,0,0,0.25); padding: 3px 8px; border-radius: 8px; font-size: 13px;" id="rewardAmountText">+50 Coins</span>
      </button>
      <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--text-muted); padding: 0 4px;">
        <span id="adCooldownTimer">Cooldown: Ready</span>
        <span id="dailyLimitText">30/day</span>
      </div>
    </div>

    <!-- Tasks List Section -->
    <div class="section-title-wrap">
      <h3 class="section-heading">⚡ Simple Partner Tasks</h3>
      <span style="font-size: 11px; color: #58a6ff; font-weight: 600;">Instant Coins</span>
    </div>

    <div id="tasksContainer">
      <!-- Tasks rendered dynamically via JS -->
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav"
